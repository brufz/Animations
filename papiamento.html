<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:RB;src:url('file:///usr/share/fonts/truetype/google-fonts/ofl/roboto/Roboto[wdth,wght].ttf');font-weight:100 900;font-stretch:75% 100%}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;perspective:1600px;perspective-origin:540px 960px;background:#000}
.world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-style:preserve-3d;transform-origin:0 0}
.pl{position:absolute;left:0;top:0;transform-origin:0 0;backface-visibility:hidden}
.pl svg{display:block}
#ov{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 62% at 50% 48%,rgba(0,0,0,0) 55%,rgba(10,5,0,.55) 100%)}
#grain{position:absolute;inset:0;background:url('noise.png');opacity:.10;mix-blend-mode:overlay}
#flash{position:absolute;inset:0;background:#fff7e6;opacity:0}
#cap{position:absolute;left:90px;right:90px;top:1440px;text-align:center;font-family:RB;font-weight:800;font-stretch:88%;font-size:74px;line-height:1.12;color:#fff;letter-spacing:.2px}
#cap span{display:inline;-webkit-text-stroke:7px rgba(12,10,8,.92);paint-order:stroke fill;text-shadow:0 4px 14px rgba(0,0,0,.55)}
#cap span.h{color:#ffd043;text-transform:uppercase;font-weight:900}
#cap span.r{color:#ff7a5c;text-transform:uppercase;font-weight:900}
#hud{position:absolute;left:0;right:0;top:250px;text-align:center;font-family:RB;font-stretch:75%;color:#fff}
#hudTag{display:inline-block;font-weight:900;font-size:46px;letter-spacing:4px;padding:10px 28px;border-radius:16px;background:#ffc531;color:#1b1510;border:5px solid #1b1510;box-shadow:0 8px 0 #1b1510}
#hudNum{font-weight:900;font-size:170px;line-height:1;margin-top:18px;-webkit-text-stroke:14px #14110f;paint-order:stroke fill;text-shadow:0 10px 20px rgba(0,0,0,.4)}
#hudNum small{font-size:70px;margin-left:12px}
#defs{position:absolute;width:0;height:0}
</style></head>
<body>
<svg id="defs" width="0" height="0"><defs>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb9c9"/><stop offset=".45" stop-color="#4d6478"/><stop offset="1" stop-color="#2c3a4a"/></linearGradient>
 <linearGradient id="glassLit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2a0"/><stop offset="1" stop-color="#f29a3e"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset=".35" stop-color="#f6c443"/><stop offset="1" stop-color="#b9781a"/></linearGradient>
 <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c98a20"/><stop offset="1" stop-color="#8f5a10"/></linearGradient>
 <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d28a"/><stop offset=".5" stop-color="#c8963f"/><stop offset="1" stop-color="#7d5620"/></linearGradient>
 <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6f8e"/><stop offset="1" stop-color="#15405e"/></linearGradient>
 <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3d0" stop-opacity=".95"/><stop offset=".35" stop-color="#ffd38a" stop-opacity=".45"/><stop offset="1" stop-color="#ffb060" stop-opacity="0"/></radialGradient>
 <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe6a0" stop-opacity=".9"/><stop offset="1" stop-color="#ff9a30" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
</defs></svg>
<div id="stage"></div>
<div id="ov"><div id="vig"></div><div id="grain"></div><div id="flash"></div>
 <div id="hud"><div id="hudTag"></div><div id="hudNum"></div></div>
 <div id="cap"></div>
</div>
<script>
const W=1080,H=1920,P=1600;
// ---------- util
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eout=x=>1-Math.pow(1-x,3);
const ein=x=>x*x*x;
const eback=(x,s=1.8)=>{x-=1;return x*x*((s+1)*x+s)+1};
function kf(t,keys,ease=eio){ // keys [[t,v],...]
  if(t<=keys[0][0])return keys[0][1];
  for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const[a,va]=keys[i-1],[b,vb]=keys[i];return lerp(va,vb,ease((t-a)/(b-a)))}}
  return keys[keys.length-1][1];
}
function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
function hx(c){c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function sh(c,f){const v=hx(c).map(x=>Math.round(f>0?x+(255-x)*f:x*(1+f)));return'#'+v.map(x=>clamp(x,0,255).toString(16).padStart(2,'0')).join('')}
function mixc(a,b,t){const A=hx(a),B=hx(b);return'#'+A.map((x,i)=>Math.round(lerp(x,B[i],t)).toString(16).padStart(2,'0')).join('')}
let _id=0;const uid=p=>p+(_id++);
const svg=(w,h,body,defs='')=>`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs>${defs}</defs>${body}</svg>`;

// ---------- 3D planes
// x,y = posição na tela (centro) com a câmera em repouso; z<0 = longe. fit compensa a perspectiva.
function plane(world,html,{x=W/2,y=H/2,z=0,w=W,h=H,blur=0,shadow=0,fit=true,op=1,cls=''}={}){
  const el=document.createElement('div');el.className='pl '+cls;el.innerHTML=html;
  el.style.width=w+'px';el.style.height=h+'px';
  const s=fit?(P-z)/P:1;
  const X=W/2+(x-W/2)*s,Y=H/2+(y-H/2)*s;
  el._base={X,Y,z,s,w,h};
  el.style.transform=`translate3d(${X}px,${Y}px,${z}px) scale(${s}) translate(${-w/2}px,${-h/2}px)`;
  const f=[];if(blur)f.push(`blur(${blur}px)`);if(shadow)f.push(`drop-shadow(0 ${shadow*.5}px ${shadow}px rgba(30,15,0,.45))`);
  if(f.length)el.style.filter=f.join(' ');
  if(op!==1)el.style.opacity=op;
  world.appendChild(el);return el;
}
function move(el,dx=0,dy=0,dz=0,extra=''){const b=el._base;el.style.transform=`translate3d(${b.X+dx}px,${b.Y+dy}px,${b.z+dz}px) scale(${b.s}) ${extra} translate(${-b.w/2}px,${-b.h/2}px)`}
function cam(world,{x=0,y=0,z=0,rx=0,ry=0,rz=0,pz=-600}={}){
  world.style.transform=`translate3d(${-x}px,${-y}px,${z}px) translate3d(${W/2}px,${H/2}px,${pz}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) translate3d(${-W/2}px,${-H/2}px,${-pz}px)`;
}

// ---------- arte
function skySVG(w,h,stops,sun,clouds){
  const g=uid('sk');let d=`<linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1">${stops.map(s=>`<stop offset="${s[0]}" stop-color="${s[1]}"/>`).join('')}</linearGradient>`;
  let b=`<rect width="${w}" height="${h}" fill="url(#${g})"/>`;
  if(sun){b+=`<circle cx="${sun[0]}" cy="${sun[1]}" r="${sun[2]*5}" fill="url(#glow)"/><circle cx="${sun[0]}" cy="${sun[1]}" r="${sun[2]}" fill="#fff6dc"/>`}
  if(clouds)b+=cloudsBody(w,h,...clouds);
  return svg(w,h,b,d);
}
function cloudsBody(w,h,n,seed,ymin,ymax,sc,light,shade,op=1){
  const r=rng(seed);let b=`<g opacity="${op}">`;
  for(let i=0;i<n;i++){const cx=r()*w,cy=lerp(ymin,ymax,r()),s=sc*(.6+r()*.8);const pf=[];
    for(let k=0;k<6;k++)pf.push([cx+(r()*2.4-1.2)*s,cy+(r()*.5-.35)*s*.6,s*(.35+r()*.4)]);
    pf.forEach(p=>b+=`<ellipse cx="${p[0]}" cy="${p[1]}" rx="${p[2]*1.3}" ry="${p[2]*.7}" fill="${shade}"/>`);
    pf.forEach(p=>b+=`<ellipse cx="${p[0]}" cy="${p[1]-p[2]*.18}" rx="${p[2]*1.18}" ry="${p[2]*.55}" fill="${light}"/>`);}
  return b+'</g>';
}
const HOUSE_COLS=['#c8553d','#e3a33b','#2f7f7a','#f1e3c3','#a34a3a','#d9824a','#3e6e8f','#e8c26a','#8c3b3b','#f0d7a8'];
function house(x,base,w,h,col,type,r,lit=0){
  let s='';const top=base-h,dark=sh(col,-.22),trim='#f7efdf',gh=w*.7;
  s+=`<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="${col}"/>`;
  // gable
  if(type===0){ // degraus
    const st=3,sw=w/(2*st+1.6),hh=gh/(st+.6);let L=[[x,top]];
    for(let i=0;i<st;i++){L.push([x+i*sw,top-(i+1)*hh]);L.push([x+(i+1)*sw,top-(i+1)*hh])}
    const pk=[[x+st*sw,top-(st+.6)*hh],[x+w-st*sw,top-(st+.6)*hh]];
    const R=L.slice().reverse().map(p=>[2*x+w-p[0],p[1]]);
    const pts=[...L,...pk,...R];s+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${col}"/>`;
  }else if(type===1){ // sino
    s+=`<path d="M${x},${top} C${x},${top-gh*.35} ${x+w*.28},${top-gh*.3} ${x+w*.28},${top-gh*.62} L${x+w*.28},${top-gh*.86} L${x+w*.5},${top-gh*1.06} L${x+w*.72},${top-gh*.86} L${x+w*.72},${top-gh*.62} C${x+w*.72},${top-gh*.3} ${x+w},${top-gh*.35} ${x+w},${top} Z" fill="${col}"/>`;
  }else{ // ponta
    s+=`<polygon points="${x},${top} ${x+w/2},${top-gh*.9} ${x+w},${top}" fill="${col}"/>`;
  }
  s+=`<rect x="${x+w*.93}" y="${top-4}" width="${w*.07}" height="${h+4}" fill="${dark}" opacity=".55"/>`;
  s+=`<rect x="${x-4}" y="${top-8}" width="${w+8}" height="12" fill="${trim}"/>`;
  s+=`<circle cx="${x+w/2}" cy="${top-gh*.38}" r="${w*.09}" fill="${trim}"/><circle cx="${x+w/2}" cy="${top-gh*.38}" r="${w*.065}" fill="${lit&&r()<.6?'url(#glassLit)':'url(#glass)'}"/>`;
  const cols=w>175?3:2,ww=w/(cols*1.9);
  for(let y=top+34;y<base-150;y+=112){for(let c=0;c<cols;c++){
    const wx=x+w*(c+.5)/cols-ww/2;const g=lit&&r()<.55?'url(#glassLit)':'url(#glass)';
    s+=`<rect x="${wx-6}" y="${y-6}" width="${ww+12}" height="86" fill="${trim}"/><rect x="${wx}" y="${y}" width="${ww}" height="74" fill="${g}"/>`;
    s+=`<line x1="${wx+ww/2}" y1="${y}" x2="${wx+ww/2}" y2="${y+74}" stroke="${trim}" stroke-width="5"/><line x1="${wx}" y1="${y+30}" x2="${wx+ww}" y2="${y+30}" stroke="${trim}" stroke-width="5"/>`;
    if(r()<.35)s+=`<rect x="${wx-24}" y="${y-2}" width="16" height="78" fill="#2f6b4f"/><rect x="${wx+ww+8}" y="${y-2}" width="16" height="78" fill="#2f6b4f"/>`;}}
  const dx=x+w*(r()<.5?.3:.62);
  s+=`<path d="M${dx-30},${base} L${dx-30},${base-96} Q${dx},${base-130} ${dx+30},${base-96} L${dx+30},${base} Z" fill="${trim}"/><path d="M${dx-22},${base} L${dx-22},${base-92} Q${dx},${base-118} ${dx+22},${base-92} L${dx+22},${base} Z" fill="#5a3726"/>`;
  return s;
}
function houseRow(w,base,seed,{hmin=260,hmax=430,wmin=140,wmax=210,lit=0,gap=0}={}){
  const r=rng(seed);let x=-20,s='';
  while(x<w){const hw=lerp(wmin,wmax,r()),hh=lerp(hmin,hmax,r());s+=house(x,base,hw,hh,HOUSE_COLS[Math.floor(r()*HOUSE_COLS.length)],Math.floor(r()*3),r,lit);x+=hw+gap}
  return s;
}
function palm(x,base,h,lean,sc=1){
  const tx=x+lean,ty=base-h;let s=`<path d="M${x},${base} Q${x+lean*.2},${base-h*.55} ${tx},${ty}" stroke="#7b5b3c" stroke-width="${24*sc}" fill="none" stroke-linecap="round"/>`;
  s+=`<path d="M${x},${base} Q${x+lean*.2},${base-h*.55} ${tx},${ty}" stroke="#5d4229" stroke-width="${24*sc}" fill="none" stroke-dasharray="${5*sc} ${18*sc}"/>`;
  const L=[[-1,.2],[-.8,-.35],[-.3,-.6],[.3,-.6],[.8,-.35],[1,.2],[-.5,.5],[.55,.5]];
  L.forEach(([dx,dy],i)=>{const ex=tx+dx*170*sc,ey=ty+dy*110*sc+60*sc*Math.abs(dx);const c=i%2?'#2f7d4a':'#45a05c';
    s+=`<path d="M${tx},${ty} Q${(tx+ex)/2},${ty+dy*130*sc-50*sc} ${ex},${ey} Q${(tx+ex)/2+6},${ty+dy*120*sc-10*sc} ${tx},${ty+8*sc}" fill="${c}"/>`});
  s+=`<circle cx="${tx-8*sc}" cy="${ty+12*sc}" r="${11*sc}" fill="#6b4a2a"/><circle cx="${tx+10*sc}" cy="${ty+14*sc}" r="${10*sc}" fill="#6b4a2a"/>`;
  return s;
}
function dutchFlag(x,y,w,h,wave=0){
  const c=['#f08a24','#ffffff','#2a4f9a'];let s='';
  for(let i=0;i<3;i++){const y0=y+i*h/3,y1=y0+h/3;s+=`<path d="M${x},${y0} Q${x+w*.5},${y0-wave} ${x+w},${y0} L${x+w},${y1} Q${x+w*.5},${y1-wave} ${x},${y1} Z" fill="${c[i]}"/>`}
  return s;
}
function ship(sc=1,wave=0){
  const W2=460,H2=520;let s=`<g transform="scale(${sc})">`;
  const masts=[[150,70],[245,40],[335,95]];
  masts.forEach(([mx,mt])=>{s+=`<line x1="${mx}" y1="400" x2="${mx}" y2="${mt}" stroke="#4a2e1c" stroke-width="9"/>`});
  masts.forEach(([mx,mt],i)=>{const sw=i==1?92:76;[[mt+40,mt+150],[mt+165,mt+265]].forEach(([y1,y2],k)=>{if(i==2&&k==1)return;const ww=sw*(k?1.08:.92);
    s+=`<path d="M${mx-ww},${y1} Q${mx},${y1-14} ${mx+ww},${y1} L${mx+ww*1.06},${y2} Q${mx+8},${y2+26} ${mx-ww*1.06},${y2} Z" fill="#f4e7c9"/>`;
    s+=`<path d="M${mx+ww*.2},${y1+4} Q${mx+ww*.6},${(y1+y2)/2} ${mx+ww*.25},${y2+14} L${mx+ww*1.06},${y2} L${mx+ww},${y1} Z" fill="#dccaa3"/>`;
    s+=`<line x1="${mx-ww-4}" y1="${y1}" x2="${mx+ww+4}" y2="${y1}" stroke="#4a2e1c" stroke-width="6"/>`})});
  s+=`<line x1="380" y1="395" x2="470" y2="330" stroke="#4a2e1c" stroke-width="7"/><path d="M390,395 L460,338 L440,392 Z" fill="#f4e7c9"/>`;
  s+=dutchFlag(245,-8,78,46,wave);
  s+=`<path d="M10,380 L120,380 L120,330 L30,330 Z" fill="#7a4628"/><rect x="18" y="320" width="104" height="12" fill="#c99a45"/>`;
  s+=`<path d="M10,380 L430,380 L405,452 Q230,476 60,452 Z" fill="#7a4628"/><path d="M60,452 Q230,476 405,452 L398,470 Q230,492 68,470 Z" fill="#3c2416"/>`;
  s+=`<rect x="30" y="398" width="390" height="10" fill="#c99a45"/>`;
  for(let i=0;i<8;i++)s+=`<rect x="${80+i*40}" y="${416}" width="16" height="14" fill="#2a1a10"/>`;
  s+=`<rect x="22" y="342" width="22" height="26" fill="url(#glassLit)" opacity=".8"/></g>`;
  return svg(W2*sc,H2*sc,s);
}
function hillOlinda(w,h,col='#5f9a52'){
  let s=`<path d="M0,${h} L0,${h*.62} Q${w*.18},${h*.35} ${w*.42},${h*.42} Q${w*.62},${h*.5} ${w*.78},${h*.58} Q${w*.92},${h*.62} ${w},${h*.66} L${w},${h} Z" fill="${col}"/>`;
  const r=rng(77);for(let i=0;i<26;i++){const x=w*(.05+r()*.7),y=h*(.5+r()*.2)+Math.abs(x-w*.42)*.12;s+=`<rect x="${x}" y="${y}" width="${30+r()*20}" height="${26+r()*12}" fill="${['#f2ead8','#e7c98d','#d9a06b'][i%3]}"/><polygon points="${x-3},${y} ${x+20},${y-14} ${x+48},${y}" fill="#b5523b"/>`}
  // igreja
  const cx=w*.4,cy=h*.42;s+=`<rect x="${cx-55}" y="${cy-70}" width="110" height="70" fill="#f4efe4"/><rect x="${cx-70}" y="${cy-120}" width="30" height="120" fill="#ece5d6"/><rect x="${cx+40}" y="${cy-120}" width="30" height="120" fill="#ece5d6"/>`;
  s+=`<polygon points="${cx-74},${cy-120} ${cx-55},${cy-150} ${cx-36},${cy-120}" fill="#b5523b"/><polygon points="${cx+36},${cy-120} ${cx+55},${cy-150} ${cx+74},${cy-120}" fill="#b5523b"/><polygon points="${cx-40},${cy-70} ${cx},${cy-100} ${cx+40},${cy-70}" fill="#ece5d6"/><path d="M${cx-12},${cy} L${cx-12},${cy-30} Q${cx},${cy-42} ${cx+12},${cy-30} L${cx+12},${cy} Z" fill="#5a3726"/>`;
  return s;
}
function waterSVG(w,h,top,bot,seed,stripes=40){
  const g=uid('wt');let b=`<rect width="${w}" height="${h}" fill="url(#${g})"/>`;const r=rng(seed);
  for(let i=0;i<stripes;i++){const y=Math.pow(r(),1.6)*h,x=r()*w,l=40+(y/h)*260;b+=`<rect x="${x}" y="${y}" width="${l}" height="${3+y/h*7}" rx="4" fill="#fff" opacity="${.12+r()*.25}"/>`}
  return svg(w,h,b,`<linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient>`);
}
function person2D(x,base,sc,col,r,armsUp=0){
  const skin=['#e8b98f','#c98e5f','#8d5a3b','#f0caa6'][Math.floor(r()*4)];const hat=r()<.4;
  let s=`<g transform="translate(${x},${base}) scale(${sc})">`;
  s+=`<rect x="-20" y="-120" width="40" height="78" rx="14" fill="${col}"/><rect x="-16" y="-48" width="13" height="48" fill="#3b2a22"/><rect x="3" y="-48" width="13" height="48" fill="#3b2a22"/>`;
  if(armsUp){s+=`<rect x="-34" y="-170" width="11" height="60" rx="5" fill="${col}" transform="rotate(-18 -28 -112)"/><rect x="23" y="-170" width="11" height="60" rx="5" fill="${col}" transform="rotate(18 28 -112)"/>`}
  s+=`<circle cx="0" cy="-142" r="24" fill="${skin}"/><circle cx="-8" cy="-146" r="3" fill="#1d1712"/><circle cx="8" cy="-146" r="3" fill="#1d1712"/>`;
  if(hat)s+=`<ellipse cx="0" cy="-160" rx="34" ry="8" fill="#2a2420"/><rect x="-18" y="-186" width="36" height="26" rx="8" fill="#2a2420"/>`;
  return s+'</g>';
}
function crowd(w,base,n,seed,sc=1,armsUp=.5){
  const r=rng(seed);let s='';const cs=['#c8553d','#2f7f7a','#e3a33b','#3e6e8f','#f1e3c3','#8c3b3b','#5f9a52'];
  const ps=[];for(let i=0;i<n;i++)ps.push([r()*w,base+r()*18,sc*(.85+r()*.3),r()<armsUp]);ps.sort((a,b)=>a[1]-b[1]).forEach(p=>s+=person(p[0],p[1],p[2],'',r,p[3]));
  return s;
}
function nassau(){return svg(420,900,sprImg('nassau',8,320,560,0,0,880-.95*735,420,735))}
function ox(){return svg(560,420,sprImg('ox',4,560,420,0,0,0,560,420))}
function bridgeSVG(w,h,deckY){
  let s='';const r=rng(9);
  for(let i=0;i<7;i++){const x=80+i*(w-160)/6;s+=`<path d="M${x-60},${h} L${x-60},${deckY+40} L${x+60},${deckY+40} L${x+60},${h} Z" fill="#b9a98c"/><rect x="${x-60}" y="${deckY+40}" width="120" height="16" fill="#d6c7a6"/><rect x="${x+40}" y="${deckY+56}" width="20" height="${h-deckY-56}" fill="#94856b"/>`}
  s+=`<rect x="0" y="${deckY}" width="${w}" height="44" fill="#7a5233"/><rect x="0" y="${deckY+30}" width="${w}" height="14" fill="#5a3a22"/>`;
  for(let x=10;x<w;x+=46)s+=`<rect x="${x}" y="${deckY-70}" width="9" height="72" fill="#6b4529"/>`;

function sprImg(file,n,fw,fh,frame,x,y,w,h,extra=''){return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="0 0 ${fw} ${fh}" preserveAspectRatio="none" overflow="hidden"><image class="sf" data-fw="${fw}" data-n="${n}" ${extra} href="sprites/${file}.png" x="${-frame*fw}" y="0" width="${fw*n}" height="${fh}"/></svg>`}
function setFrame(el,f){el.querySelectorAll('image.sf').forEach(i=>i.setAttribute('x',-(f%(+i.dataset.n))*(+i.dataset.fw)))}
function animCrowd(el,t){el.querySelectorAll('image.sf[data-ch="1"]').forEach((i,k)=>{const n=+i.dataset.n,ph=+i.dataset.ph;i.setAttribute('x',-((Math.floor(t*7+ph)%n))*(+i.dataset.fw))})}
function person(x,base,sc,col,r,armsUp){const v=Math.floor(r()*10),k=.56*sc,w=240*k,h=400*k;const ph=Math.floor(r()*6);
  return sprImg('pv'+v,6,240,400,armsUp?ph:0,x-w/2,base-h*.94,w,h,armsUp?`data-ch="1" data-ph="${ph}"`:'')}

function plaque(txt,col='#fff',size=400){return `<div style="font-family:RB;font-weight:900;font-stretch:75%;font-size:${size}px;color:${col};opacity:.9;line-height:1;text-align:center">${txt}</div>`}
function label(txt,size=60,col='#ffe9b0'){return `<div style="font-family:RB;font-weight:900;font-stretch:80%;font-size:${size}px;color:${col};text-align:center;-webkit-text-stroke:9px #14110f;paint-order:stroke fill">${txt}</div>`}
function engenho(x,base,sc){return `<g transform="translate(${x},${base}) scale(${sc})"><rect x="-120" y="-110" width="240" height="110" fill="#f2ead8"/><polygon points="-135,-110 0,-170 135,-110" fill="#b5523b"/><rect x="60" y="-230" width="34" height="120" fill="#c9b79a"/><rect x="-80" y="-70" width="40" height="70" fill="#5a3726"/><rect x="0" y="-80" width="36" height="34" fill="url(#glass)"/><circle cx="-170" cy="-50" r="60" fill="none" stroke="#6b4529" stroke-width="12"/>${[0,45,90,135].map(a=>`<line x1="-170" y1="-50" x2="${-170+60*Math.cos(a*Math.PI/180)}" y2="${-50+60*Math.sin(a*Math.PI/180)}" stroke="#6b4529" stroke-width="8" transform="rotate(0)"/><line x1="-170" y1="-50" x2="${-170-60*Math.cos(a*Math.PI/180)}" y2="${-50-60*Math.sin(a*Math.PI/180)}" stroke="#6b4529" stroke-width="8"/>`).join('')}</g>`}
function postLandscape(w,h,paint=0){
  const c=paint?['#a7b97a','#86a05e','#6a8a4c']:['#8fae6a','#6f9450','#557c3e'];
  let s=`<rect width="${w}" height="${h}" fill="${paint?'#d9e2d0':'none'}"/>`;
  if(paint)s+=`<rect width="${w}" height="${h*.55}" fill="#cfdde6"/>`;
  s+=hills(w,h,c)+engenho(w*.55,h*.74,w/1600)+palm(w*.18,h*.86,h*.42,-w*.02,w/1300)+palm(w*.84,h*.9,h*.36,w*.03,w/1500);
  return s;
}

function hud(T){
  let tag='',num='',a=0;
  if(T>=7.0&&T<9.5){tag='HOMENS';num=fmt(7280*eout(prog(T,7.1,8.8)));a=prog(T,7.0,7.3)}
  else if(T>=32.3&&T<35.8){tag='BATALHAS DOS GUARARAPES';num='';a=prog(T,32.3,32.6)}
  else if(T>=43.6&&T<46.6){tag='FUGIRAM DO RECIFE';num=fmt(23*eout(prog(T,43.8,44.9)))+'<small>judeus</small>';a=prog(T,43.6,43.9)}

  });

  SCENES.forEach((S,i)=>{if(S.world.style.display==='block'){const prev=SCENES[i-1];S.world.style.zIndex=(prev&&T<prev.t1+XF&&T>=S.t0)?1:2}});

},(S,t)=>{const D=S.t1-S.t0,u=t/D;
  cam(S.world,{z:kfu(t,D,[[0,0],[.5,180],[1,260]]),y:kfu(t,D,[[0,40],[1,-30]]),ry:kfu(t,D,[[0,-4],[1,3]])});
  parkUpdate(S,t);

  const lts=[...S.gate.querySelectorAll('.lt')];lts.forEach((e,i)=>{const off=prog(u,.06+i*.025,.1+i*.025),on=prog(u,.42+i*.012,.46+i*.012);e.setAttribute('opacity',Math.max(1-off,on))});
  const dim=prog(u,.08,.3)*(1-prog(u,.42,.5));S.world.style.filter=`saturate(${1-dim*.9}) brightness(${1-dim*.35})`;
  S.conf.style.opacity=prog(u,.44,.5);move(S.conf,0,(t*420)%1100);
  const dk=eback(prog(u,.8,.88));S.danki.style.opacity=dk>0?1:0;move(S.danki,0,0,0,`scale(${Math.max(.01,dk)}) rotate(${Math.sin(t*3)*3}deg)`);
  S.fade.style.opacity=prog(u,.94,1);
});
