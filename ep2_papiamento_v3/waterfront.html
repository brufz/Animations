<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body><canvas id="c" width="300" height="500"></canvas>
<script src="lib3d.js"></script><script>
// Cais de Willemstad (Handelskade vista de Otrobanda): fachadas coloridas do outro lado da baía
const SCENE_GLSL=`
const float HW=.925;const float SP=1.95;const float HZ=17.5;
float HH(float i){return 3.1+1.7*hash(vec2(i,2.));}
float GT(float i){return floor(hash(vec2(i,5.))*3.);}
vec2 house(vec3 p,float i){
  float xc=i*SP;vec3 q=p-vec3(xc,0.,HZ);float H=HH(i);float g=GT(i);
  float b=sdRBox(q,vec3(0,H*.5,0),vec3(HW,H*.5,.9),.02);
  float gab=1e3;
  vec3 f=q-vec3(0,H,-.82);
  if(g<.5){ // empena em sino
    float c=sdRBox(f,vec3(0,.5,0),vec3(.42,.5,.1),.0);
    float sl=min(sdEll(f,vec3(-.45,.0,0),vec3(.5,.6,.1)),sdEll(f,vec3(.45,.0,0),vec3(.5,.6,.1)));sl=max(sl,-f.y);sl=max(sl,abs(f.x)-HW);
    gab=min(c,sl);gab=min(gab,sdEll(f,vec3(0,1.02,0),vec3(.3,.16,.1)));
  }else if(g<1.5){ // empena escalonada
    gab=min(min(sdRBox(f,vec3(0,.18,0),vec3(HW,.18,.1),0.),sdRBox(f,vec3(0,.54,0),vec3(.65,.18,.1),0.)),sdRBox(f,vec3(0,.9,0),vec3(.36,.18,.1),0.));
  }else{ // frontão triangular com cornija
    gab=max(max(abs(f.z)-.1,-f.y),abs(f.x)*.75+f.y-.75);
  }
  vec2 r=vec2(min(b,gab),30.+i*.01+10.);
  // telhado vermelho atrás
  vec3 rq=q-vec3(0,H,.05);float roof=max(max(abs(rq.x)*.85+rq.y*.6-.78,-rq.y),abs(rq.z)-.85);
  r=U(r,vec2(roof,21.));
  // cornija branca
  r=U(r,vec2(sdRBox(q,vec3(0,H-.04,-.9),vec3(HW+.03,.05,.05),.01),22.));
  return r;}
vec2 palm(vec3 p,vec3 c,float s){vec3 q=(p-c)/s;{float bd=length(q-vec3(.3,2.2,0))-2.;if(bd*s>.4)return vec2(bd*s,0.);}
  vec2 r=vec2(1e3,0.);vec3 a=vec3(0);for(int i=1;i<=6;i++){float t=float(i)/6.;vec3 b=vec3(.35*t*t,3.*t,0.);r=U(r,vec2(sdCap(q,a,b,.09-.03*t),23.));a=b;}
  for(int i=0;i<7;i++){float an=float(i)/7.*6.283;vec3 d=vec3(cos(an),-.35,sin(an));vec3 m=a+d*.7;r=U(r,vec2(sdEll(q,m,vec3(.8,.08,.22)*vec3(abs(d.x)+.3,1.,abs(d.z)+.3)),24.));}
  r.x*=s;return r;}
vec2 scene(vec3 p){
  vec2 r=vec2(1e3,0.);
  if(layer>1.5){ // primeiro plano: cabeço de amarração e corda
    r=U(r,vec2(sdCyl(p,vec3(-.85,.55,-4.6),.3,.2)-.03,25.));r=U(r,vec2(sdEll(p,vec3(-.85,.9,-4.6),vec3(.28,.1,.28)),25.));
    // vaso com flores à direita
    r=U(r,vec2(sdCyl(p,vec3(1.25,2.35,-4.7),.15,.22)-.02,27.));
    float fl=1e3;for(int i=0;i<8;i++){float a=float(i)*.8;fl=smin(fl,sdSph(p,vec3(1.25+.25*cos(a),2.62+.12*sin(a*2.),-4.7+.25*sin(a)),.14),.06);}
    r=U(r,vec2(fl,28.));return r;}
  if(layer<.5){
    r=U(r,vec2(sdRBox(p,vec3(0,-.5,-8.),vec3(40.,.5,10.),0.),1.));
    // muro do cais
    r=U(r,vec2(sdRBox(p,vec3(0,-.35,2.05),vec3(30.,.35,.08),0.),2.));
    r=U(r,vec2(sdCyl(p,vec3(-2.4,.2,1.75),.2,.13)-.03,25.));r=U(r,vec2(sdCyl(p,vec3(2.9,.2,1.75),.2,.13)-.03,25.));
    // poste de luz
    r=U(r,vec2(sdCyl(p,vec3(3.4,1.4,1.2),1.4,.05),25.));r=U(r,vec2(sdSph(p,vec3(3.4,2.85,1.2),.17),29.));
    return r;}
  // fundo
  float wat=max(abs(p.z-8.5)-6.5,p.y+.6);r=U(r,vec2(max(p.y+.6,abs(p.z-8.5)-6.6),50.));
  r=U(r,vec2(sdRBox(p,vec3(0,-.35,15.6),vec3(40.,.3,.6),.0),2.)); // cais do outro lado
  r=U(r,vec2(sdRBox(p,vec3(0,-.5,40.),vec3(80.,.5,25.),0.),3.));
  float i0=floor(p.x/SP+.5);
  for(int k=-1;k<=1;k++){float i=i0+float(k);if(abs(i)<12.)r=U(r,house(p,i));}
  r=U(r,palm(p,vec3(-5.,0.,19.2),1.2));r=U(r,palm(p,vec3(6.2,0.,19.4),1.35));r=U(r,palm(p,vec3(1.,0.,19.6),1.1));
  float hl=1e3;for(int i=0;i<5;i++){hl=min(hl,sdEll(p,vec3(-40.+float(i)*20.,0.,55.),vec3(16.,6.+3.*hash(vec2(float(i),9.)),8.)));}
  r=U(r,vec2(hl,14.));
  return r;}
bool groundOK(vec3 p){return false;}
float groundMat(vec3 p){return 1.;}
vec3 SKY(vec3 rd){vec3 top=vec3(.25,.55,.92),hor=vec3(.78,.9,.98);float y=clamp(rd.y*2.,0.,1.);vec3 c=mix(hor,top,pow(y,.6));
  vec3 L=normalize(vec3(-.4,.75,.55));float s=max(dot(rd,L),0.);c+=vec3(1.,.9,.7)*pow(s,10.)*.3;
  if(rd.y>0.){vec2 q=rd.xz/(rd.y+.12)*1.1;float cl=smoothstep(.55,.85,vn(q*1.2)*.6+vn(q*3.3)*.4);c=mix(c,vec3(1.),cl*.7*smoothstep(0.,.2,rd.y));}
  return c;}
vec3 PAL(float i){int k=int(mod(floor(hash(vec2(i,7.))*7.),7.));
  vec3 cs[7]=vec3[](vec3(.98,.8,.3),vec3(.95,.55,.62),vec3(.45,.75,.92),vec3(.55,.85,.7),vec3(.98,.6,.32),vec3(.72,.6,.9),vec3(.98,.9,.7));return cs[k];}
vec3 mcol(float m,vec3 p,vec3 n,inout float ks,inout float em){
  if(m<1.5){vec2 g=p.xz*vec2(1.3,1.3);vec2 id=floor(g);float h=hash(id);vec2 f=fract(g);float e=smoothstep(0.,.05,min(min(f.x,1.-f.x),min(f.y,1.-f.y)));return mix(vec3(.6,.55,.5),mix(vec3(.82,.76,.68),vec3(.9,.85,.76),h),.3+.7*e);}
  if(m<2.5)return vec3(.72,.66,.58)*(.85+.15*vn(p.xy*6.));
  if(m<3.5)return vec3(.85,.8,.72);
  if(m<14.5)return vec3(.45,.6,.4);
  if(m>39.5&&m<41.){float i=floor((m-40.)*100.+.5)-30.;i=floor((m-40.)*100.+.5);i=i-0.;
    float idx=floor(p.x/SP+.5);vec3 c=PAL(idx);float lx=p.x-idx*SP;float H=HH(idx);
    if(n.z<-.5&&p.y<H-.1){ // janelas na fachada
      float fl=floor((p.y-.25)/1.05);float ly=p.y-.25-fl*1.05;
      for(int k=-1;k<=1;k+=2){float wx=lx-float(k)*.42;
        if(abs(wx)<.2&&ly>.3&&ly<.92){float fr=max(abs(wx)-.15,max(.36-ly,ly-.86));return fr>0.?vec3(.97,.96,.92):(abs(wx)<.012||abs(ly-.6)<.012?vec3(.97):vec3(.18,.24,.3));}
        if(abs(wx)<.31&&abs(wx)>.2&&ly>.32&&ly<.9)return vec3(.2,.5,.42)*(.9+.1*step(.5,fract(ly*14.)));}
      if(fl<.5&&abs(lx)<.17&&ly<.85&&p.y<1.2)return vec3(.4,.22,.14);}
    if(p.y>H-.12&&p.y<H+.03)return vec3(.97,.96,.92);
    if(p.y>H&&n.z<-.5){float g=GT(idx);if(g<1.5&&abs(lx)>HW-.06)return vec3(.97,.96,.92);}
    return c;}
  if(m<21.5)return vec3(.78,.32,.2);if(m<22.5)return vec3(.98,.97,.93);if(m<23.5)return vec3(.55,.42,.3);if(m<24.5)return vec3(.3,.58,.3);
  if(m<25.5){ks=.6;return vec3(.18,.2,.22);}if(m<26.5)return vec3(.75,.65,.45);if(m<27.5)return vec3(.75,.42,.28);if(m<28.5){float h=hash(floor(p.xy*12.));return h>.5?vec3(.95,.3,.6):vec3(.98,.55,.75);}
  if(m<29.5){em=1.;return vec3(1.,.95,.8);}
  if(m>49.5){ // água turquesa
    return mix(vec3(.05,.45,.55),vec3(.1,.6,.65),.5);}
  return vec3(1.,0.,1.);}
`;
make3d(SCENE_GLSL);
</script></body></html>
