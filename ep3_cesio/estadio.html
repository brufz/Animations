<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body><canvas id="c" width="300" height="500"></canvas>
<script src="lib3d.js"></script><script>
// Estádio Olímpico de Goiânia virado posto de triagem: arquibancadas de concreto, gramado, tendas com mesas. layer 1 cenário; 2 primeiro plano
const SCENE_GLSL=`
vec2 tent(vec3 p,vec3 c){vec3 q=p-c;float bd=sdRBox(q,vec3(0,1.4,0),vec3(1.8,1.6,1.6),.0);if(bd>.5)return vec2(bd,0.);
  vec2 r=vec2(1e3,0.);for(int i=0;i<4;i++){float x=i<2?-1.5:1.5;float z=i%2==0?-1.3:1.3;r=U(r,vec2(sdCyl(q,vec3(x,1.1,z),1.1,.04),5.));}
  float roof=max(sdRBox(q,vec3(0,2.4,0),vec3(1.6,.4,1.4),.0),dot(vec2(abs(q.x),q.y-2.8),normalize(vec2(.45,1.))));r=U(r,vec2(roof,6.));
  r=U(r,vec2(sdRBox(q,vec3(0,.75,.3),vec3(1.1,.03,.4),.01),7.));r=U(r,vec2(sdRBox(q,vec3(0,.38,.3),vec3(1.05,.37,.02),.0),7.));
  r=U(r,vec2(sdRBox(q,vec3(.5,.83,.3),vec3(.12,.06,.09),.02),8.));return r;}
vec2 scene(vec3 p){
  vec2 r=vec2(1e3,0.);
  if(layer>1.5){r=U(r,vec2(sdRBox(p,vec3(-2.,.5,-4.),vec3(3.,.04,.04),.0),9.));r=U(r,vec2(sdCyl(p,vec3(-4.8,.5,-4.),.5,.05),9.));r=U(r,vec2(sdCyl(p,vec3(.8,.5,-4.),.5,.05),9.));return r;}
  if(!INSH)r=U(r,vec2(p.y,1.));
  // pista de atletismo + gramado (material pelo chão)
  // arquibancada em degraus
  {vec3 q=p-vec3(0,0,10.);float bd=sdRBox(q,vec3(0,4.,3.),vec3(40.,4.5,4.),.0);
   if(bd<.5){float d=1e3;for(int i=0;i<9;i++){float fi=float(i);d=min(d,sdRBox(q,vec3(0,(fi+1.)*.375,fi*.8+.4),vec3(40.,(fi+1.)*.375,.4),.0));}
     r=U(r,vec2(d,2.));r=U(r,vec2(sdRBox(q,vec3(0,7.3,7.6),vec3(40.,.6,.3),.0),3.));
     r=U(r,vec2(sdRBox(q,vec3(0,.6,-.2),vec3(40.,.6,.12),.0),4.));}
   else r=U(r,vec2(bd,2.));}
  // torres de iluminação
  for(int i=0;i<2;i++){float x=i==0?-12.:14.;r=U(r,vec2(sdCyl(p,vec3(x,8.,17.),8.,.25),3.));r=U(r,vec2(sdRBox(p,vec3(x,16.5,17.),vec3(1.4,.9,.2),.05),10.));}
  // tendas de triagem
  r=U(r,tent(p,vec3(-3.5,0,4.5)));r=U(r,tent(p,vec3(1.,0,5.)));r=U(r,tent(p,vec3(5.5,0,4.5)));
  // cordão de isolamento
  for(int i=0;i<6;i++){r=U(r,vec2(sdCyl(p,vec3(-6.+float(i)*2.2,.5,1.2),.5,.04),11.));}
  r=U(r,vec2(sdCap(p,vec3(-6.,.85,1.2),vec3(5.,.85,1.2),.015),12.));
  return r;}
bool groundOK(vec3 p){return layer>.5&&layer<1.5;}
float groundMat(vec3 p){return 1.;}
vec3 SKY(vec3 rd){vec3 top=vec3(.38,.6,.88),hor=vec3(.95,.88,.74);float y=clamp(rd.y*2.2,0.,1.);vec3 c=mix(hor,top,pow(y,.7));
  if(rd.y>0.){vec2 q=rd.xz/(rd.y+.15)*1.2;float cl=smoothstep(.55,.85,vn(q*1.3)*.6+vn(q*3.1)*.4);c=mix(c,vec3(1.,.98,.95),cl*.5*smoothstep(0.,.25,rd.y));}return c;}
vec3 mcol(float m,vec3 p,vec3 n,inout float ks,inout float em){
  if(m<1.5){if(p.z>8.2)return vec3(.72,.36,.26)*(.9+.1*vn(p.xz*4.));float st=step(.5,fract(p.x*.25));vec3 g=mix(vec3(.36,.6,.28),vec3(.42,.68,.32),st);float ln=step(abs(p.z-0.),.05);return mix(g*(.9+.1*vn(p.xz*5.)),vec3(.95),ln);}
  if(m<2.5){float f=fract(p.y/.75);vec3 c=vec3(.78,.77,.74);if(n.y<.5)c*=.85;return c*(.92+.08*vn(p.xz*3.));}
  if(m<3.5)return vec3(.7,.7,.72);if(m<4.5)return vec3(.2,.45,.35);
  if(m<5.5){ks=.4;return vec3(.8);}if(m<6.5){float s=step(.5,fract(p.x*1.2));return mix(vec3(.97,.97,.95),vec3(.85,.25,.2),s*step(p.y,2.25));}
  if(m<7.5)return vec3(.9,.88,.84);if(m<8.5){ks=.6;return vec3(.95,.8,.2);}if(m<9.5){ks=.4;return vec3(.85,.8,.2);}if(m<10.5){em=.0;return vec3(.85);}
  if(m<11.5)return vec3(.9,.5,.1);if(m<12.5)return vec3(.95,.85,.2);
  return vec3(1,0,1);}
`;
make3d(SCENE_GLSL);
</script></body></html>
