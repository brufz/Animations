<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body><canvas id="c" width="300" height="500"></canvas>
<script src="lib3d.js"></script><script>
// Interiores: sunset=0 cozinha (noite, luz quente); 1 sala da Vigilância Sanitária (dia); 2 laboratório (azul da Prússia)
// layer 1 = sala; layer 0 = mesa/bancada (perto); layer 2 = primeiro plano desfocado; layer 6 = brilho azul (pó na mesa)
const SCENE_GLSL=`
vec2 chair(vec3 p,vec3 c,float a){vec3 q=p-c;q.xz*=rot(a);vec2 r=vec2(sdRBox(q,vec3(0,.45,0),vec3(.22,.03,.22),.01),4.);
  r=U(r,vec2(sdRBox(q,vec3(0,.75,.2),vec3(.22,.3,.03),.01),4.));for(int i=0;i<4;i++){float sx=i<2?-.19:.19;float sz=i%2==0?-.19:.19;r=U(r,vec2(sdRBox(q,vec3(sx,.22,sz),vec3(.02,.22,.02),.0),4.));}return r;}
vec2 scene(vec3 p){
  vec2 r=vec2(1e3,0.);float V=sunset;
  if(layer>5.5){ if(V<.5){float d=1e3;for(int i=0;i<9;i++){float fi=float(i);d=min(d,sdSph(p,vec3(-.35+.09*fi,.8,.95+.07*sin(fi*2.3)),.012+.008*hash(vec2(fi,2.))));}return vec2(d,80.);} return r;}
  if(layer>1.5){ if(V<.5)r=U(r,vec2(sdCyl(p,vec3(1.35,.55,-2.6),.55,.12),5.)); else if(V<1.5)r=U(r,vec2(sdSph(p,vec3(-1.3,1.,-2.6),.55)+.15*vn(p.xy*4.),30.)); else r=U(r,vec2(sdCyl(p,vec3(1.2,.75,-2.4),.18,.1),40.)); return r;}
  // mesa (perto) em layer 0
  if(layer<.5){
    if(V<.5){ // mesa de jantar com toalha, pratos, panela
      r=U(r,vec2(sdRBox(p,vec3(0,.76,1.),vec3(.95,.03,.55),.01),3.));r=U(r,vec2(sdRBox(p,vec3(0,.55,1.),vec3(.97,.2,.57),.0)+.0,6.));
      r=U(r,vec2(max(sdRBox(p,vec3(0,.6,1.),vec3(.98,.18,.58),.0),-sdRBox(p,vec3(0,.6,1.),vec3(.96,.3,.56),.0)),6.));
      for(int i=0;i<3;i++){float x=-.55+float(i)*.55;r=U(r,vec2(sdCyl(p,vec3(x,.795,.75),.012,.17),7.));}
      r=U(r,vec2(sdCyl(p,vec3(.15,.86,1.25),.08,.16),8.));r=U(r,vec2(sdCyl(p,vec3(-.5,.83,1.3),.06,.05),9.));
      for(int i=0;i<4;i++){float x=i<2?-.85:.85;float z=i%2==0?.6:1.4;r=U(r,vec2(sdRBox(p,vec3(x,.38,z),vec3(.03,.38,.03),.0),4.));}
      r=U(r,chair(p,vec3(-.55,0,1.75),3.14));r=U(r,chair(p,vec3(.55,0,1.75),3.14));
    } else if(V<1.5){ // mesa de escritório com papéis e a bolsa
      r=U(r,vec2(sdRBox(p,vec3(.2,.75,.8),vec3(1.,.035,.5),.01),10.));r=U(r,vec2(sdRBox(p,vec3(.2,.38,1.25),vec3(.98,.37,.03),.0),10.));
      r=U(r,vec2(sdRBox(p,vec3(-.85,.38,.8),vec3(.03,.37,.48),.0),10.));r=U(r,vec2(sdRBox(p,vec3(1.15,.38,.8),vec3(.03,.37,.48),.0),10.));
      r=U(r,vec2(sdRBox(p,vec3(-.4,.79,.75),vec3(.2,.01,.15),.0),11.));r=U(r,vec2(sdRBox(p,vec3(-.38,.8,.78),vec3(.19,.01,.14),.0),11.));
      r=U(r,vec2(sdRBox(p,vec3(.55,.9,.85),vec3(.22,.14,.13),.05),12.)); // sacola
      r=U(r,vec2(sdRBox(p,vec3(.95,.86,.6),vec3(.12,.1,.12),.01),13.)); // máquina de escrever
    } else { // bancada de laboratório com frascos
      r=U(r,vec2(sdRBox(p,vec3(0,.9,.9),vec3(1.3,.04,.5),.01),20.));r=U(r,vec2(sdRBox(p,vec3(0,.44,.95),vec3(1.28,.42,.45),.0),21.));
      r=U(r,vec2(sdCyl(p,vec3(-.1,1.08,.8),.13,.14),22.));r=U(r,vec2(sdCyl(p,vec3(-.1,1.24,.8),.03,.15),23.)); // pote de pigmento
      r=U(r,vec2(sdCyl(p,vec3(-.1,1.17,.8),.05,.125),24.)); // pigmento azul
      for(int i=0;i<4;i++){float x=.35+float(i)*.22;r=U(r,vec2(sdCyl(p,vec3(x,1.02+.03*float(i%2),.95),.09+.03*float(i%2),.05),25.+float(i%2)));}
      r=U(r,vec2(sdCyl(p,vec3(-.7,1.04,.95),.1,.16),27.)); // lata de tinta
    }
    return r;}
  // sala (layer 1)
  if(!INSH){r=U(r,vec2(p.y,1.));r=U(r,vec2(4.-p.z,2.));r=U(r,vec2(4.+p.x,2.1));r=U(r,vec2(4.-p.x,2.1));r=U(r,vec2(3.-p.y,2.2));}
  if(V<.5){ // cozinha
    r=U(r,vec2(sdRBox(p,vec3(-1.5,1.6,3.98),vec3(.7,.55,.04),.0),31.)); // janela noite
    r=U(r,vec2(sdRBox(p,vec3(-1.5,1.6,3.94),vec3(.74,.03,.04),.0),4.));r=U(r,vec2(sdRBox(p,vec3(-1.5,1.6,3.94),vec3(.03,.59,.04),.0),4.));
    r=U(r,vec2(sdRBox(p,vec3(1.,.45,3.7),vec3(1.4,.45,.3),.01),32.));r=U(r,vec2(sdRBox(p,vec3(1.,.92,3.7),vec3(1.42,.03,.32),.01),33.)); // pia/balcão
    r=U(r,vec2(sdRBox(p,vec3(3.2,.85,3.5),vec3(.4,.85,.4),.08),34.)); // geladeira
    r=U(r,vec2(sdRBox(p,vec3(.6,2.1,3.85),vec3(1.,.35,.15),.01),32.)); // armário
    r=U(r,vec2(sdCap(p,vec3(0,3.,1.1),vec3(0,2.35,1.1),.01),4.));r=U(r,vec2(sdCCone(p,vec3(0,2.25,1.1),.12,.32,.08),35.));r=U(r,vec2(sdSph(p,vec3(0,2.14,1.1),.07),36.));
    r=U(r,vec2(sdRBox(p,vec3(-3.,1.3,3.98),vec3(.35,.45,.02),.0),37.)); // quadro
  } else if(V<1.5){ // escritório
    r=U(r,vec2(sdRBox(p,vec3(1.3,1.7,3.98),vec3(1.,.6,.04),.0),38.));r=U(r,vec2(sdRBox(p,vec3(1.3,1.7,3.94),vec3(.03,.63,.04),.0),10.));
    for(int i=0;i<3;i++){r=U(r,vec2(sdRBox(p,vec3(-2.8+float(i)*.62,.7,3.7),vec3(.29,.7,.28),.01),39.));}
    r=U(r,vec2(sdRBox(p,vec3(-.9,1.9,3.98),vec3(.45,.6,.02),.0),41.)); // cartaz
    r=U(r,vec2(sdRBox(p,vec3(0,1.2,3.97),vec3(4.,.03,.02),.0),42.));
  } else { // laboratório
    for(int i=0;i<3;i++){r=U(r,vec2(sdRBox(p,vec3(-1.5,1.2+float(i)*.5,3.85),vec3(1.4,.025,.15),.0),21.));
      for(int j=0;j<7;j++){float x=-2.7+float(j)*.4;r=U(r,vec2(sdCyl(p,vec3(x,1.32+float(i)*.5,3.85),.1,.07),25.+float((i+j)%3)));}}
    r=U(r,vec2(sdRBox(p,vec3(2.,1.7,3.98),vec3(.9,.6,.04),.0),38.));
  }
  return r;}
bool groundOK(vec3 p){return false;}
float groundMat(vec3 p){return 1.;}
vec3 SKY(vec3 rd){return vec3(.9,.88,.84);}
vec3 mcol(float m,vec3 p,vec3 n,inout float ks,inout float em){float V=sunset;
  if(m<1.5){vec2 t=floor(p.xz*2.5);float c=mod(t.x+t.y,2.);return V<.5?mix(vec3(.75,.7,.62),vec3(.62,.3,.22),c):(V<1.5?vec3(.6,.56,.5)*(.9+.1*c):mix(vec3(.85),vec3(.7,.72,.74),c));}
  if(m<2.15){if(V<.5){float tl=step(.05,fract(p.x*4.))*step(.05,fract(p.y*4.));return p.y<1.2?mix(vec3(.6),vec3(.92,.94,.9),tl):vec3(.96,.88,.7);}return V<1.5?(p.y<1.2?vec3(.55,.7,.65):vec3(.93,.92,.86)):vec3(.92,.94,.95);}
  if(m<2.35){em=1.;return (V<.5?vec3(.62,.55,.45):vec3(.8,.8,.78))*(.85+.15*smoothstep(6.,0.,length(p.xz)));}
  if(m<3.5){float ch=step(.5,fract(p.x*3.))+step(.5,fract(p.z*3.));return mod(ch,2.)<.5?vec3(.95,.92,.88):vec3(.85,.3,.25);}
  if(m<4.5)return vec3(.45,.3,.18);if(m<5.5)return vec3(.4,.3,.2);
  if(m<6.5){float ch=step(.5,fract(p.x*3.))+step(.5,fract(p.y*3.));return mod(ch,2.)<.5?vec3(.95,.92,.88):vec3(.85,.3,.25);}
  if(m<7.5){ks=.6;return vec3(.97);}if(m<8.5){ks=.8;return vec3(.6,.62,.65);}if(m<9.5){ks=.5;return vec3(.95,.85,.6);}
  if(m<10.5)return vec3(.42,.36,.3);if(m<11.5)return vec3(.97,.96,.92);if(m<12.5)return vec3(.55,.35,.25);if(m<13.5){ks=.5;return vec3(.15,.25,.2);}
  if(m<20.5){ks=.4;return vec3(.85,.86,.84);}if(m<21.5)return vec3(.6,.62,.6);if(m<22.5){ks=.9;return vec3(.85,.9,.95);}if(m<23.5){ks=.6;return vec3(.2);}
  if(m<24.5)return vec3(.05,.15,.5);if(m<25.5){ks=.9;return vec3(.75,.85,.8);}if(m<26.5){ks=.9;return vec3(.7,.55,.3);}if(m<27.5){ks=.6;return vec3(.1,.25,.6);}
  if(m<30.5)return vec3(.3,.5,.25);if(m<31.5){em=1.;return vec3(.12,.18,.36)+vec3(.9,.8,.5)*step(.985,hash(floor(p.xy*30.)));}
  if(m<32.5)return vec3(.85,.78,.6);if(m<33.5){ks=.6;return vec3(.85,.85,.82);}if(m<34.5){ks=.6;return vec3(.96,.96,.94);}if(m<35.5){ks=.4;return vec3(.85,.3,.2);}if(m<36.5){em=1.;return vec3(1.5,1.3,.9);}
  if(m<37.5)return vec3(.3,.5,.6);if(m<38.5){em=1.;return vec3(.85,.93,1.);}if(m<39.5){ks=.5;return vec3(.55,.6,.6);}
  if(m<40.5){ks=.8;return vec3(.2,.3,.7);}if(m<41.5)return vec3(.9,.8,.3);if(m<42.5)return vec3(.4,.55,.5);
  if(m>79.){em=1.;return vec3(.6,1.3,2.2);}
  return vec3(1,0,1);}
`;
make3d(SCENE_GLSL);
</script></body></html>
