<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body><canvas id="c" width="300" height="500"></canvas>
<script src="lib3d.js"></script><script>
// Close da cápsula de césio rompida sobre a bancada do ferro-velho (escala ampliada).
// layer 1 = bancada + cápsula; layer 3 = fundo (oficina) para desfocar; layer 6 = pó azul emissivo
const SCENE_GLSL=`
vec2 scene(vec3 p){
  vec2 r=vec2(1e3,0.);
  if(layer>5.5){ // pó: monte cônico + rastro saindo da cápsula + grãos espalhados
    float d=sdCCone(p,vec3(.55,.06,-.25),.06,.34,.05)+.015*vn(p.xz*40.);
    vec3 a=vec3(-.05,.02,-.02),b=vec3(.45,.02,-.22);d=smin(d,sdCap(p,a,b,.035)+.01*vn(p.xz*50.),.06);
    for(int i=0;i<18;i++){float fi=float(i);vec3 c=vec3(.3+.65*hash(vec2(fi,1.)),.01,-.55+.6*hash(vec2(fi,2.)));d=min(d,sdSph(p,c,.012+.012*hash(vec2(fi,3.))));}
    return vec2(d,80.);}
  if(layer>2.5&&layer<3.5){ // fundo da oficina (será desfocado)
    r=U(r,vec2(9.-p.z,2.));
    for(int i=0;i<4;i++){r=U(r,vec2(sdRBox(p,vec3(-3.+float(i)*2.2,1.6,8.5),vec3(.9,1.2,.3),.05),9.));}
    r=U(r,vec2(sdRBox(p,vec3(1.,3.,8.9),vec3(1.2,.8,.05),.0),10.));
    for(int i=0;i<3;i++){r=U(r,vec2(sdTorZ(p,vec3(-1.5+float(i)*.9,.9,7.5),vec2(.45,.18)),11.));}
    r=U(r,vec2(sdCyl(p,vec3(3.2,.8,7.),.8,.5),12.));r=U(r,vec2(sdSph(p,vec3(-3.,2.4,6.),.25),13.));
    return r;}
  if(!INSH)r=U(r,vec2(p.y,1.));
  // cápsula de aço deitada, boca virada para o pó
  vec3 q=p-vec3(-.45,.3,.05);q.xz*=rot(.35);
  float cap=sdCyl(q.yxz,vec3(0),.55,.3);cap=max(cap,-sdCyl(q.yxz,vec3(0,.52,0),.2,.2));
  r=U(r,vec2(cap,3.));r=U(r,vec2(sdTorZ(q.zyx,vec3(0,0,.55),vec2(.28,.035)),4.));
  r=U(r,vec2(sdCyl(q.yxz,vec3(0,.3,0),.02,.19),6.)); // brilho lá dentro
  // carcaça de chumbo partida ao redor
  for(int i=0;i<5;i++){float fi=float(i);vec3 k=p-vec3(-1.35+fi*.32,.06,-.65+.5*hash(vec2(fi,1.)));k.xz*=rot(fi*1.7);k.xy*=rot(.2*hash(vec2(fi,4.)));r=U(r,vec2(sdRBox(k,vec3(0),vec3(.17,.05,.11),.03),5.));}
  r=U(r,vec2(max(sdCyl(p.yxz-vec3(.12,-1.25,.5),vec3(0),.3,.32),-sdCyl(p.yxz-vec3(.12,-1.25,.5),vec3(0),.32,.24)),5.));
  // ferramentas na bancada
  r=U(r,vec2(sdCap(p,vec3(.9,.03,.45),vec3(1.6,.03,.75),.03),7.));r=U(r,vec2(sdRBox(p,vec3(.85,.06,.43),vec3(.12,.05,.06),.01),7.));
  return r;}
bool groundOK(vec3 p){return false;}
float groundMat(vec3 p){return 1.;}
vec3 SKY(vec3 rd){return vec3(.78,.74,.68);}
vec3 mcol(float m,vec3 p,vec3 n,inout float ks,inout float em){
  if(m<1.5){float pl=step(.03,fract(p.z*1.6));return mix(vec3(.38,.27,.17),vec3(.55,.4,.26),vn(p.xz*vec2(1.,14.))*.7+.3*hash(vec2(floor(p.z*1.6),1.)))*(.85+.15*pl);}
  if(m<2.5)return vec3(.42,.46,.44);
  if(m<3.5){ks=.9;return vec3(.72,.74,.78)*(.9+.1*vn(p.xy*20.));}if(m<4.5){ks=.9;return vec3(.55,.57,.6);}
  if(m<5.5){ks=.3;return vec3(.45,.46,.5)*(.85+.2*vn(p.xz*12.));}if(m<6.5){em=1.;return vec3(.5,1.1,2.);}
  if(m<7.5){ks=.6;return vec3(.35,.3,.28);}
  if(m<9.5)return vec3(.75,.42,.22);if(m<10.5){em=1.;return vec3(1.2,1.1,.95);}if(m<11.5)return vec3(.12);if(m<12.5)return vec3(.25,.45,.7);if(m<13.5){em=1.;return vec3(1.5,1.2,.8);}
  if(m>79.){em=1.;float s=step(.9,hash(floor(p.xz*90.)));return vec3(.35,.85,1.7)+vec3(.9,1.,1.)*s*.8;}
  return vec3(1,0,1);}
`;
make3d(SCENE_GLSL);
</script></body></html>
