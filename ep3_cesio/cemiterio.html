<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body><canvas id="c" width="300" height="500"></canvas>
<script src="lib3d.js"></script><script>
// Cemitério: muro branco, túmulos e cruzes, ciprestes; dois caixões de chumbo com flores; velas para o memorial.
// layer 1 cenário; layer 2 primeiro plano; layer 6 chamas das velas
const SCENE_GLSL=`
vec2 grave(vec3 p,vec3 c,float s){vec3 q=p-c;float bd=sdRBox(q,vec3(0,.7,0),vec3(.8,1.,1.3),.0);if(bd>.5)return vec2(bd,0.);
  vec2 r=vec2(sdRBox(q,vec3(0,.2,0),vec3(.55,.2,1.05),.03),2.);r=U(r,vec2(sdRBox(q,vec3(0,.75,.95),vec3(.5,.55,.1),.05),2.));
  if(s>.5){r=U(r,vec2(sdRBox(q,vec3(0,1.55,.95),vec3(.04,.32,.04),.0),3.));r=U(r,vec2(sdRBox(q,vec3(0,1.65,.95),vec3(.18,.04,.04),.0),3.));}return r;}
vec2 scene(vec3 p){
  vec2 r=vec2(1e3,0.);
  if(layer>5.5){float d=1e3;for(int i=0;i<2;i++){float x=i==0?-.25:.25;d=min(d,sdEll(p,vec3(x,.62,-.6),vec3(.025,.06,.025)));}return vec2(d,80.);}
  if(layer>1.5){r=U(r,vec2(sdEll(p,vec3(2.8,1.2,-4.),vec3(.6,1.4,.6))+.1*vn(p.xy*5.),6.));return r;}
  if(!INSH)r=U(r,vec2(p.y,1.));
  r=U(r,vec2(sdRBox(p,vec3(0,1.3,12.),vec3(40.,1.3,.2),.02),4.));r=U(r,vec2(sdRBox(p,vec3(0,2.65,12.),vec3(40.,.08,.3),.0),5.));
  for(int i=0;i<5;i++){for(int j=0;j<2;j++){float x=-6.+float(i)*2.4+float(j)*1.2;r=U(r,grave(p,vec3(x,0,5.5+float(j)*3.),hash(vec2(float(i),float(j)))));}}
  for(int i=0;i<4;i++){float x=-7.+float(i)*4.6;vec3 q=p-vec3(x,0,10.);r=U(r,vec2(sdEll(q,vec3(0,2.,0),vec3(.55,2.,.55))+.08*vn(q.xy*4.),6.));}
  // dois caixões de chumbo com flores
  for(int i=0;i<2;i++){float x=i==0?4.4:5.6;vec3 q=p-vec3(x,0,2.4);r=U(r,vec2(sdRBox(q,vec3(0,.3,0),vec3(.3,.25,.95),.04),7.));
    r=U(r,vec2(sdEll(q,vec3(0,.6,-.2),vec3(.22,.1,.3))+.03*vn(q.xz*30.),8.));}
  // memorial: túmulo com duas velas e flores (perto)
  r=U(r,vec2(sdRBox(p,vec3(0,.25,0),vec3(.9,.25,.5),.03),2.));r=U(r,vec2(sdRBox(p,vec3(0,.95,.35),vec3(.75,.5,.08),.04),9.));
  for(int i=0;i<2;i++){float x=i==0?-.25:.25;r=U(r,vec2(sdCyl(p,vec3(x,.56,-.6),.06,.03),10.));}
  r=U(r,vec2(sdEll(p,vec3(.55,.58,-.35),vec3(.18,.08,.14))+.03*vn(p.xz*40.),8.));r=U(r,vec2(sdEll(p,vec3(-.6,.58,-.3),vec3(.16,.08,.12))+.03*vn(p.xz*40.),8.));
  return r;}
bool groundOK(vec3 p){return layer>.5&&layer<1.5;}
float groundMat(vec3 p){return 1.;}
vec3 SKY(vec3 rd){vec3 top=vec3(.55,.66,.82),hor=vec3(.9,.88,.84);float y=clamp(rd.y*2.2,0.,1.);vec3 c=mix(hor,top,pow(y,.7));
  if(rd.y>0.){vec2 q=rd.xz/(rd.y+.15)*1.2;float cl=smoothstep(.45,.8,vn(q*1.3)*.6+vn(q*3.1)*.4);c=mix(c,vec3(.95,.95,.95),cl*.6*smoothstep(0.,.25,rd.y));}return c;}
vec3 mcol(float m,vec3 p,vec3 n,inout float ks,inout float em){
  if(m<1.5)return mix(vec3(.55,.62,.4),vec3(.62,.58,.45),vn(p.xz*.8))*(.9+.1*vn(p.xz*8.));
  if(m<2.5)return vec3(.88,.87,.84)*(.92+.08*vn(p.xy*6.));if(m<3.5)return vec3(.4,.38,.36);
  if(m<4.5)return vec3(.95,.94,.9)*(.9+.1*vn(p.xy*3.));if(m<5.5)return vec3(.7,.68,.64);if(m<6.5)return mix(vec3(.2,.35,.22),vec3(.3,.45,.25),vn(p.xy*3.));
  if(m<7.5){ks=.6;return vec3(.5,.52,.56);}if(m<8.5){float h=vn(p.xz*25.);return h>.6?vec3(.98,.98,.95):(h>.35?vec3(.95,.85,.4):vec3(.3,.5,.25));}
  if(m<9.5)return vec3(.82,.8,.78);if(m<10.5)return vec3(.97,.95,.9);
  if(m>79.){em=1.;return vec3(1.6,1.1,.45);}
  return vec3(1,0,1);}
`;
make3d(SCENE_GLSL);
</script></body></html>
