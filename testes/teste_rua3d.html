<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script>
const VS=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const FS=`#version 300 es
precision highp float;
uniform vec2 R;uniform float T;uniform float yaw;uniform float wave;
out vec4 o;
float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float sdSph(vec3 p,vec3 c,float r){return length(p-c)-r;}
float sdEll(vec3 p,vec3 c,vec3 r){p-=c;float k0=length(p/r),k1=length(p/(r*r));return k0*(k0-1.)/k1;}
float sdCyl(vec3 p,vec3 c,float h,float r){p-=c;vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h);return min(max(d.x,d.y),0.)+length(max(d,0.))-0.01;}
float sdRBox(vec3 p,vec3 c,vec3 b,float r){vec3 q=abs(p-c)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
vec2 U(vec2 a,vec2 b){return a.x<b.x?a:b;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
// materiais: 1 pele 2 casaco 3 faixa laranja 4 chapéu 5 cabelo 6 renda 7 bota 8 calça 9 olho 10 chão 11 pena 12 botão
vec2 nassau(vec3 p){
  
  vec2 r=vec2(1e3,10.);
  // pernas
  r=U(r,vec2(min(sdCap(p,vec3(-.16,.25,0),vec3(-.16,.75,0),.12),sdCap(p,vec3(.16,.25,0),vec3(.16,.75,0),.12)),8.));
  r=U(r,vec2(min(sdRBox(p,vec3(-.17,.14,.04),vec3(.13,.14,.17),.04),sdRBox(p,vec3(.17,.14,.04),vec3(.13,.14,.17),.04)),7.));
  // tronco (casaco) - cápsula larga
  float torso=smin(sdEll(p,vec3(0,1.15,0),vec3(.42,.5,.3)),sdEll(p,vec3(0,.85,0),vec3(.4,.32,.3)),.1);
  r=U(r,vec2(torso,2.));
  // faixa laranja diagonal
  vec3 q=p-vec3(0,1.1,0);q.xy*=rot(-.75);
  float sash=max(abs(q.y)-.07,torso-.03);
  r=U(r,vec2(sash,3.));
  // botões
  float bt=1e3;for(int i=0;i<4;i++){bt=min(bt,sdSph(p,vec3(.05,.8+float(i)*.16,-.3+.02*float(i)),.03));}
  r=U(r,vec2(bt,12.));
  // braços (um acenando)
  float ang=.6+.35*sin(T*6.)*wave;
  vec3 sh=vec3(.4,1.45,0);vec3 el=sh+vec3(.2,.18*ang+.1,-.05);vec3 hd=el+vec3(.08,.35*ang,-.05);
  float arm=min(sdCap(p,sh,el,.1),sdCap(p,el,hd,.09));
  arm=min(arm,sdCap(p,vec3(-.4,1.45,0),vec3(-.5,1.0,.02),.1));arm=min(arm,sdCap(p,vec3(-.5,1.0,.02),vec3(-.48,.65,-.02),.09));
  r=U(r,vec2(arm,2.));
  r=U(r,vec2(min(sdSph(p,hd+vec3(0,.06,0),.1),sdSph(p,vec3(-.48,.58,-.02),.1)),1.));
  // gola de renda
  r=U(r,vec2(sdEll(p,vec3(0,1.6,0),vec3(.36,.08,.28)),6.));
  // cabeça
  float head=sdEll(p,vec3(0,1.95,0),vec3(.33,.36,.32));
  r=U(r,vec2(head,1.));
  // nariz
  r=U(r,vec2(sdEll(p,vec3(0,1.9,-.33),vec3(.05,.07,.05)),1.));
  // cabelo longo (atrás e laterais)
  float hair=smin(sdEll(p,vec3(0,1.9,.06),vec3(.38,.4,.32)),sdEll(p,vec3(0,1.65,.12),vec3(.4,.25,.25)),.1);
  hair=max(hair,-(p.z+.12));hair=max(hair,-sdEll(p,vec3(0,1.93,-.2),vec3(.3,.32,.3)));
  r=U(r,vec2(hair,5.));
  // bigode e cavanhaque
  r=U(r,vec2(min(sdCap(p,vec3(-.11,1.81,-.3),vec3(.11,1.81,-.3),.035),sdEll(p,vec3(0,1.7,-.29),vec3(.05,.08,.04))),5.));
  // olhos
  r=U(r,vec2(min(sdEll(p,vec3(-.11,1.98,-.29),vec3(.04,.055,.03)),sdEll(p,vec3(.11,1.98,-.29),vec3(.04,.055,.03))),9.));
  // sobrancelhas
  r=U(r,vec2(min(sdCap(p,vec3(-.17,2.08,-.28),vec3(-.05,2.09,-.3),.02),sdCap(p,vec3(.05,2.09,-.3),vec3(.17,2.08,-.28),.02)),5.));
  // chapéu: aba + copa + fita
  r=U(r,vec2(sdCyl(p,vec3(0,2.22,0),.025,.62),4.));
  r=U(r,vec2(smin(sdCyl(p,vec3(0,2.36,0),.13,.3),sdSph(p,vec3(0,2.45,0),.28),.08),4.));
  r=U(r,vec2(sdCyl(p,vec3(0,2.29,0),.05,.315),3.));
  // pena
  vec3 f=p-vec3(.22,2.55,.05);f.xy*=rot(-.7);
  r=U(r,vec2(sdEll(f,vec3(0),vec3(.06,.3,.03)),11.));
  return r;
}

float hs(float n){return fract(sin(n*127.1)*43758.5453);}
vec2 person(vec3 p,vec3 pos,float id){
  p-=pos; vec2 r=vec2(1e3,0);
  float body=sdEll(p,vec3(0,.55,0),vec3(.2,.32,.16));
  float legs=min(sdCap(p,vec3(-.08,.05,0),vec3(-.08,.3,0),.06),sdCap(p,vec3(.08,.05,0),vec3(.08,.3,0),.06));
  float arms=min(sdCap(p,vec3(-.2,.75,0),vec3(-.28,.42,-.02),.055),sdCap(p,vec3(.2,.75,0),vec3(.3,.45+.25*hs(id+3.),-.05),.055));
  r=U(r,vec2(min(body,arms),30.+floor(hs(id)*6.)));
  r=U(r,vec2(legs,8.));
  r=U(r,vec2(sdEll(p,vec3(0,1.02,0),vec3(.17,.19,.17)),1.+.5*step(.5,hs(id+7.))));
  r=U(r,vec2(min(sdEll(p,vec3(-.06,1.05,-.15),vec3(.022,.03,.02)),sdEll(p,vec3(.06,1.05,-.15),vec3(.022,.03,.02))),9.));
  if(hs(id+1.)>.4){r=U(r,vec2(min(sdCyl(p,vec3(0,1.17,0),.015,.28),sdCyl(p,vec3(0,1.25,0),.08,.15)),4.));}
  return r;
}
vec2 houses(vec3 p){
  float cs=1.7; float id=floor((p.z+cs*.5)/cs); float lz=p.z-id*cs;
  float sd=sign(p.x); float lx=abs(p.x)-3.45;
  float k=id*7.+sd*3.;
  float h=2.3+hs(k)*1.7; float w=.8;
  float box=sdRBox(vec3(lx,p.y,lz),vec3(0,h*.5,0),vec3(.8,h*.5,w-.03),.01);
  float gb=max(sdRBox(vec3(lx,p.y,lz),vec3(0,h+.5,0),vec3(.78,.5,w-.05),.0),(abs(lz)*1.15+(p.y-h)-.85)/1.52);
  float hh=min(box,gb);
  // degraus do frontão (alguns)
  if(hs(k+5.)>.5){float st=max(sdRBox(vec3(lx,p.y,lz),vec3(0,h+.45,0),vec3(.79,.45,w-.05),.0),-(floor((.9-abs(lz))/.22)*.22*.9+h-p.y)+.0);hh=min(box,min(gb,max(st,abs(lz)-.72)));}
  // calçada e telhado
  return vec2(hh,20.+floor(hs(k+2.)*8.));
}
vec2 palm(vec3 p,vec3 pos){
  p-=pos; vec2 r=vec2(1e3,0);
  vec3 a=vec3(0),b=vec3(.15,1.,0),c=vec3(.35,2.,0),d=vec3(.45,2.9,0);
  r=U(r,vec2(min(min(sdCap(p,a,b,.1),sdCap(p,b,c,.085)),sdCap(p,c,d,.07)),40.));
  for(int i=0;i<8;i++){float an=float(i)*.785;vec3 q=p-d;q.xz*=rot(an);q.xy*=rot(-.5);r=U(r,vec2(sdEll(q,vec3(.7,-.05,0),vec3(.75,.05,.16)),41.));}
  r=U(r,vec2(sdSph(p,d+vec3(0,-.12,0),.12),42.));
  return r;
}
vec2 map(vec3 p){
  vec2 r=vec2(p.y,10.);
  r=U(r,houses(p));
  vec3 q=p-vec3(.1,0,2.3);q.xz*=rot(.2);q/=.62;vec2 n=nassau(q);n.x*=.62;r=U(r,n);
  r=U(r,person(p,vec3(-1.15,0,3.6),1.));
  r=U(r,person(p,vec3(1.35,0,5.2),2.));
  r=U(r,person(p,vec3(-.5,0,7.8),3.));
  r=U(r,person(p,vec3(.9,0,10.5),4.));
  r=U(r,palm(p,vec3(-2.2,0,4.4)));
  r=U(r,palm(p,vec3(2.25,0,6.6)));
  return r;
}
vec3 nor(vec3 p){vec2 e=vec2(.003,0);return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x));}
float ao(vec3 p,vec3 n){float o=0.,s=1.;for(int i=1;i<6;i++){float h=.06*float(i);o+=(h-map(p+n*h).x)*s;s*=.6;}return clamp(1.-2.2*o,0.,1.);}
float shadow(vec3 ro,vec3 rd){float res=1.,t=.03;for(int i=0;i<56;i++){float h=map(ro+rd*t).x;res=min(res,6.*h/t);t+=clamp(h,.03,.4);if(res<.002||t>14.)break;}return clamp(res,0.,1.);}
vec3 col(float m){
  if(m<1.5)return vec3(.91,.70,.53);if(m<2.5)return vec3(.16,.2,.33);if(m<3.5)return vec3(.95,.52,.13);if(m<4.5)return vec3(.1,.1,.12);
  if(m<5.5)return vec3(.33,.21,.12);if(m<6.5)return vec3(.97,.95,.9);if(m<7.5)return vec3(.08,.07,.07);if(m<8.5)return vec3(.25,.18,.14);
  if(m<9.5)return vec3(.03);if(m<10.5)return vec3(.85,.78,.65);if(m<11.5)return vec3(.98,.97,.94);return vec3(.9,.75,.4);}

vec3 pal(float i){i=mod(i,8.);if(i<1.)return vec3(.78,.33,.24);if(i<2.)return vec3(.89,.64,.23);if(i<3.)return vec3(.18,.5,.48);if(i<4.)return vec3(.95,.89,.76);if(i<5.)return vec3(.64,.29,.23);if(i<6.)return vec3(.85,.51,.29);if(i<7.)return vec3(.24,.43,.56);return vec3(.91,.76,.42);}
vec3 shirt(float i){i=mod(i,6.);if(i<1.)return vec3(.78,.33,.24);if(i<2.)return vec3(.18,.5,.48);if(i<3.)return vec3(.89,.64,.23);if(i<4.)return vec3(.24,.43,.56);if(i<5.)return vec3(.95,.89,.76);return vec3(.37,.6,.32);}
vec3 skyc(vec3 rd){vec3 L=normalize(vec3(-.35,.18,1.));float s=max(dot(rd,L),0.);vec3 c=mix(vec3(1.,.78,.55),vec3(.35,.45,.75),clamp(rd.y*1.6,0.,1.));c+=vec3(1.,.75,.45)*pow(s,8.)*.6+vec3(1.,.95,.8)*pow(s,200.)*2.;return c;}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
  vec3 ro=vec3(.35,1.05,-3.2),ta=vec3(-.1,1.35,6.);
  vec3 ww=normalize(ta-ro),uu=normalize(cross(vec3(0,1,0),ww)),vv=cross(ww,uu);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+1.35*ww);
  float t=0.;vec2 h;for(int i=0;i<180;i++){h=map(ro+rd*t);if(abs(h.x)<.0004*t+.0003||t>40.)break;t+=h.x*.8;}
  vec3 L=normalize(vec3(-.3,.5,-.81));
  vec3 res;
  if(t>40.){res=skyc(rd);}else{
    vec3 p=ro+rd*t,n=nor(p);float m=h.y;
    vec3 c;
    if(abs(m-10.)<.5){ // calçada de ondas
      float w=sin(p.z*5.2+1.6*sin(p.x*2.6));float bw=step(0.,w);
      vec2 g=abs(fract(p.xz*9.)-.5);float gr=smoothstep(.0,.12,min(g.x,g.y));
      c=mix(vec3(.12,.11,.12),vec3(.9,.86,.78),bw)*(.75+.25*gr);
      if(abs(p.x)>2.6)c=vec3(.55,.5,.45);
    }else if(m>=20.&&m<29.){
      c=pal(m-20.);
      // janelas na fachada voltada para a rua
      float face=step(.7,abs(n.x));
      float cs=1.7;float id=floor((p.z+cs*.5)/cs);float lz=p.z-id*cs;float sd=sign(p.x);float k=id*7.+sd*3.;float hh=2.3+hs(k)*1.7;
      vec2 f=vec2((lz+.78)/.52,p.y/.72);vec2 fw=fract(f);vec2 fi=floor(f);
      float win=step(.28,fw.x)*step(fw.x,.72)*step(.25,fw.y)*step(fw.y,.82)*step(1.,fi.y)*step(p.y,hh-.25)*face;
      float frame=(step(.22,fw.x)*step(fw.x,.78)*step(.2,fw.y)*step(fw.y,.87))*step(1.,fi.y)*step(p.y,hh-.2)*face;
      float lit=step(.6,hs(fi.x*13.+fi.y*7.+k));
      c=mix(c,vec3(.97,.94,.88),frame);
      c=mix(c,mix(vec3(.2,.27,.35),vec3(1.,.72,.35)*1.6,lit),win);
      float door=step(abs(lz-.25),.17)*step(p.y,.62)*face;c=mix(c,vec3(.33,.2,.13),door);
      float corn=smoothstep(.04,.0,abs(p.y-hh))*face;c=mix(c,vec3(.97,.94,.88),corn);
    }else if(m>=30.&&m<39.)c=shirt(m-30.);
    else if(m>39.5&&m<40.5){c=vec3(.48,.36,.24)*(.8+.2*step(.5,fract(p.y*6.)));}
    else if(m>40.5&&m<41.5)c=vec3(.3,.66,.34);
    else if(m>41.5&&m<42.5)c=vec3(.4,.26,.14);
    else c=col(m);
    float sh=shadow(p+n*.02,L);float dif=clamp(dot(n,L),0.,1.)*sh;
    float a=ao(p,n);float sky=.5+.5*n.y;float bounce=clamp(-n.y,0.,1.);
    float rim=pow(1.-clamp(dot(n,-rd),0.,1.),3.);
    vec3 lin=vec3(1.,.85,.66)*dif*1.35+vec3(.5,.56,.78)*sky*.55*a+vec3(1.,.8,.6)*.18*a+vec3(.6,.45,.35)*bounce*.25*a+vec3(1.,.75,.5)*rim*.25*a*sh;
    res=c*lin;
    res=mix(res,skyc(rd)*.95,1.-exp(-.0022*t*t));
  }
  res=pow(res,vec3(.9));res*=1.-.25*dot(uv,uv);
  o=vec4(res,1);
}`;
const c=document.getElementById('c');const gl=c.getContext('webgl2',{preserveDrawingBuffer:true});
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
window.draw=(T)=>{gl.uniform2f(gl.getUniformLocation(pr,'R'),c.width,c.height);gl.uniform1f(gl.getUniformLocation(pr,'T'),T);gl.uniform1f(gl.getUniformLocation(pr,'yaw'),0);gl.uniform1f(gl.getUniformLocation(pr,'wave'),1);gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();return 1};
</script></body></html>
