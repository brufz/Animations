<!DOCTYPE html><html><head><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"./build/three.module.js","three/addons/":"./examples/jsm/"}}</script></head><body>
<script type="module">
// Palco: elenco variado (cast.js) com a câmera dos cenários; atores com caminho, animação e virada
import * as THREE from 'three';import {load,pose} from './cast.js';
let r,sc,cam,sun,A=[];
window.setup=async(o)=>{
  r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(o.w,o.h);r.setClearColor(0,0);
  r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=o.exposure||1.05;r.outputColorSpace=THREE.SRGBColorSpace;r.domElement.style.transform="scaleX(-1)";document.body.appendChild(r.domElement);
  sc=new THREE.Scene();cam=new THREE.PerspectiveCamera(2*Math.atan(.5/o.span)*180/Math.PI,o.w/o.h,.05,200);cam.position.set(...o.camP);cam.lookAt(...o.camT);
  const lt=o.light||{};sc.add(new THREE.HemisphereLight(lt.sky??0xe2efff,lt.gnd??0x9a7058,lt.hemi??1.7));
  sun=new THREE.DirectionalLight(lt.sunC??0xfff0dc,lt.sunI??2.7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5});sun.shadow.bias=-.0005;sun.shadow.radius=4;sc.add(sun);sc.add(sun.target);
  const rim=new THREE.DirectionalLight(lt.rimC??0xffe2c0,lt.rimI??1.1);rim.position.set(2,3,8);sc.add(rim);
  const g=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:.33}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;sc.add(g);
  window._o=o;
  for(const a of o.actors){const X=await load(a.spec);X.obj.position.set(a.keys[0][1],X.obj.userData.y0,a.keys[0][2]);X.obj.rotation.y=a.rotY||0;sc.add(X.obj);X.a=a;A.push(X);}
  return 1};
// a.keys: [[t, x, z, rotY, anim, animT0]] — interpola posição/rotação; troca de animação com mistura de 0.3s
window.frame=(t)=>{
  for(const X of A){const K=X.a.keys;let i=0;while(i<K.length-1&&K[i+1][0]<=t)i++;
    const k=K[i],n=K[Math.min(i+1,K.length-1)];const u=n[0]>k[0]?Math.min(1,Math.max(0,(t-k[0])/(n[0]-k[0]))):0;
    const lerp=(a,b)=>a+(b-a)*u;X.obj.position.x=lerp(k[1],n[1]);X.obj.position.z=lerp(k[2],n[2]);
    const ru=Math.min(1,(t-k[0])/0.35);X.obj.rotation.y=(i>0?K[i-1][3]:k[3])+(k[3]-(i>0?K[i-1][3]:k[3]))*Math.max(0,ru);
    const pk=i>0?K[i-1]:null;const w=pk&&pk[4]!==k[4]?Math.max(0,1-(t-k[0])/0.3):0;
    if(w>0)pose(X,k[4],(t-k[0])+(k[5]||0),pk[4],(t-pk[0])+(pk[5]||0),w);else pose(X,k[4],(t-k[0])+(k[5]||0));X.obj.position.y=X.obj.userData.y0;fx(X,t);}
  const L=_o.Ldir;sun.target.position.set(0,0,-1);sun.position.set(L[0]*10,L[1]*10,L[2]*10-1);
  r.render(sc,cam);return 1};

// ---- efeitos procedurais
const _v=new THREE.Vector3(),_w=new THREE.Vector3(),_q=new THREE.Quaternion(),_p=new THREE.Quaternion();
function bone(X,n){if(!X._b){X._b={};X.obj.traverse(o=>{if(o.isBone)X._b[o.name.replace(/^mixamorig:?/,'')]=o})}return X._b[n]}
function aim(b,c,dirW,w){X0.obj.updateMatrixWorld(true);b.getWorldPosition(_v);c.getWorldPosition(_w);const cur=_w.sub(_v).normalize();
  const q=new THREE.Quaternion().setFromUnitVectors(cur,dirW.clone().normalize());q.slerp(new THREE.Quaternion(),1-w);
  const wq=b.getWorldQuaternion(new THREE.Quaternion());const nw=q.multiply(wq);b.parent.getWorldQuaternion(_p);b.quaternion.copy(_p.invert().multiply(nw));}
let X0;
// mão reta em relação ao antebraço e palma virada para a frente
function palm(X,sd,H,loc,w,tgt,fw){X.obj.traverse(o=>{if(o.isBone&&o.userData.r&&new RegExp(sd+'Hand(Thumb|Index|Middle|Ring|Pinky)').test(o.name))o.quaternion.slerp(o.userData.r[1],w*(fw??1)*(/Thumb/.test(o.name)?.6:.9))});const kid=bone(X,sd+'HandMiddle1'),i1=bone(X,sd+'HandIndex1'),p1=bone(X,sd+'HandPinky1'),FA=bone(X,sd+'ForeArm');if(!kid||!i1||!p1)return;
  X0.obj.updateMatrixWorld(true);const pf=FA.getWorldPosition(new THREE.Vector3()),ph=H.getWorldPosition(new THREE.Vector3());aim(H,kid,ph.clone().sub(pf),w);
  X0.obj.updateMatrixWorld(true);const h=H.getWorldPosition(new THREE.Vector3()),m=kid.getWorldPosition(new THREE.Vector3()).sub(h).normalize();
  const a=i1.getWorldPosition(new THREE.Vector3()).sub(h),b=p1.getWorldPosition(new THREE.Vector3()).sub(h);let n=new THREE.Vector3().crossVectors(a,b).normalize();if(sd==='Left')n.negate();if(window.PALMSIGN)n.negate();
  const f=tgt||loc(0,0,1);const pn=n.clone().sub(m.clone().multiplyScalar(n.dot(m))).normalize(),pfw=f.clone().sub(m.clone().multiplyScalar(f.dot(m))).normalize();
  let ang=Math.acos(Math.max(-1,Math.min(1,pn.dot(pfw))));if(new THREE.Vector3().crossVectors(pn,pfw).dot(m)<0)ang=-ang;
  const q=new THREE.Quaternion().setFromAxisAngle(m,ang*w);const wq=H.getWorldQuaternion(new THREE.Quaternion());const nw=q.multiply(wq);H.parent.getWorldQuaternion(_p);H.quaternion.copy(_p.invert().multiply(nw));}
function inWin(t,W){if(!W)return null;for(const w of W)if(t>=w[0]-0.35&&t<=w[1]+0.35)return [w,Math.min(1,(t-w[0]+0.35)/0.35,(w[1]+0.35-t)/0.35)];return null}
function fx(X,t){X0=X;const F=X.a.fx||{};const ry=X.obj.rotation.y;const loc=(x,y,z)=>new THREE.Vector3(x,y,z).applyAxisAngle(new THREE.Vector3(0,1,0),ry);
  const W=inWin(t,F.wave);if(W){const [w,k]=W;const sides=w[2]==='both'?['Right','Left']:[w[2]||'Right'];const ex=w[2]==='both';
    for(const sd of sides){const sg=sd==='Right'?-1:1;const A=bone(X,sd+'Arm'),FA=bone(X,sd+'ForeArm'),H=bone(X,sd+'Hand');if(!A)continue;
      const ph=Math.sin(t*(ex?7:9)+(sd==='Left'?1.3:0));
      aim(A,FA,loc(sg*(ex?.55:.7),ex?.85:.45,.15),k);aim(FA,H,loc(sg*(.1+.22*ph),1,.12),k);palm(X,sd,H,loc,k);}}
  const H=inWin(t,F.hop);if(H){const [w,k]=H;const ph=Math.abs(Math.sin((t-w[0])*Math.PI*(w[3]||2.4)));X.obj.position.y+=k*(w[2]||.1)*ph;}
  // vida: cabeça olhando ao redor, coluna trocando o peso, gestos ao falar
  const sd=X.a.seed??(X.a.keys[0][5]||0)*7.3;const TK=inWin(t,F.talk);const tk=TK?TK[1]:0;const L=F.live??1;
  const hd=bone(X,'Head'),sp=bone(X,'Spine1'),nk=bone(X,'Neck');
  if(hd&&L){const yaw=(.13*Math.sin(.45*t+sd)+.05*Math.sin(1.27*t+2*sd))*L+(F.lookYaw||0),pit=(.04*Math.sin(.6*t+sd*1.7))*L+tk*(.06*Math.sin(5.5*t)+.03)+(F.lookDown||0),rol=.04*Math.sin(.33*t+sd)*L;
    const e=new THREE.Euler(window.AX?pit*window.AX[0]:pit,window.AX?yaw*window.AX[1]:yaw,window.AX?rol*window.AX[2]:rol,'YXZ');hd.quaternion.multiply(new THREE.Quaternion().setFromEuler(e));}
  if(sp&&L){const e=new THREE.Euler(0,.05*Math.sin(.3*t+sd)*L,.035*Math.sin(.38*t+sd*1.3)*L);sp.quaternion.multiply(new THREE.Quaternion().setFromEuler(e));}
  if(tk>0&&!W){for(const s2 of ['Right','Left']){const sg=s2==='Right'?-1:1;const AR=bone(X,s2+'Arm'),FA=bone(X,s2+'ForeArm'),HH=bone(X,s2+'Hand');if(!FA)continue;
      const ph=Math.sin(t*3.1+(s2==='Left'?1.9:0)+sd),ph2=Math.sin(t*1.7+sd*2);const amp=s2==='Right'?1:.6;
      aim(AR,FA,loc(sg*(.32+.1*ph2),-1,.3),tk*.5*amp);aim(FA,HH,loc(sg*(.45+.25*ph2),.1+.5*Math.max(0,ph)*amp,.7),tk*.85*amp);palm(X,s2,HH,loc,tk*.8*amp,loc(-sg*.4,1,0),.5);}}
  // rosto (morph targets de quem tiver)
  let mo=0;const T=inWin(t,F.talk);if(T){const n=Math.sin(t*23)*.5+Math.sin(t*14.3)*.5;mo=T[1]*Math.max(0,n)*.75;}
  X.obj.traverse(o=>{if(o.morphTargetDictionary){const d=o.morphTargetDictionary;if(d.mouthOpen!==undefined)o.morphTargetInfluences[d.mouthOpen]=mo;if(d.mouthSmile!==undefined)o.morphTargetInfluences[d.mouthSmile]=F.smile||0;}});}
window.ok=1;
</script></body></html>
